# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-workshopplatform"
BBFILE_PATTERN_meta-workshopplatform = "^${LAYERDIR}/"

LAYERSERIES_COMPAT_meta-workshopplatform = "walnascar scarthgap"
