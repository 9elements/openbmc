# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "turin2d24tm3-2l-layer"
BBFILE_PATTERN_turin2d24tm3-2l-layer = "^${LAYERDIR}/"
LAYERSERIES_COMPAT_turin2d24tm3-2l-layer = "whinlatter walnascar"
