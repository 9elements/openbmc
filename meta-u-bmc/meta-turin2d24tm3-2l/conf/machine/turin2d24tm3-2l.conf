KMACHINE = "aspeed"
KERNEL_DEVICETREE = "aspeed/${KMACHINE}-bmc-asrock-${MACHINE}.dtb"

UBOOT_MACHINE = "ast2600_openbmc_spl_defconfig"
#UBOOT_DEVICETREE = "asrock-turin2d24tm3-2l-u-boot"
UBOOT_DEVICETREE = "ast2600-evb"
SOCSEC_SIGN_ENABLE = "0"
SPL_BINARY = "spl/u-boot-spl.bin"

FLASH_SIZE = "65536"

require conf/machine/include/ast2600.inc
include conf/machine/include/obmc-bsp-common.inc

MACHINE_FEATURES:remove = "obmc-host-ipmi"

IMAGE_FEATURES:remove = " \
    obmc-bmc-state-mgmt \
    obmc-bmcweb \
    obmc-chassis-mgmt \
    obmc-chassis-state-mgmt \
    obmc-console \
    obmc-dbus-monitor \
    obmc-debug-collector \
    obmc-devtools \
    obmc-fan-control \
    obmc-fan-mgmt \
    obmc-flash-mgmt \
    obmc-health-monitor \
    obmc-host-ctl \
    obmc-host-ipmi \
    obmc-host-state-mgmt \
    obmc-ikvm \
    obmc-inventory \
    obmc-leds \
    obmc-logging-mgmt \
    obmc-remote-logging-mgmt \
    obmc-sensors \
    obmc-settings-mgmt \
    obmc-software \
    obmc-system-mgmt \
    obmc-telemetry \
    obmc-webui \
"
